name: テスト

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JQUANTS_API_KEY: test
      TIDB_HOST: localhost
      TIDB_PORT: "4000"
      TIDB_DATABASE: test
      TIDB_USER: test
      TIDB_PASSWORD: test
      GEMINI_API_KEY: test
      EDINET_API_KEY: test
      EDINETDB_API_KEY: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
