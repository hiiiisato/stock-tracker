name: 日次市場データ更新

# 時刻の正本は Cloudflare Scheduler。GitHub Actions は実行基盤だけを担当する。
# GitHub cron の遅延・重複を避けるため、定刻起動は workflow_dispatch に一本化する。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード（catch_up = target_dateを強制救済）'
        type: choice
        options: [main, evening, catch_up, notify_test, youtube_daily]
        default: main
      source:
        description: '起動元（cloudflare / codex / manual）'
        type: string
        default: manual
      scheduled_for:
        description: '予定実行時刻（ISO 8601・処理対象日の正本）'
        type: string
        default: ''
      target_date:
        description: 'catch_up対象営業日（YYYY-MM-DD）'
        type: string
        default: ''

# Cloudflare便・自動再試行・手動便が重なっても、同じDB更新を並列実行しない。
concurrency:
  group: daily-market-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 全銘柄の公式照合を含む救済便にも余裕を持たせる（通常便は完了時点で終了）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 日次データ更新
        env:
          TIDB_HOST:      ${{ secrets.TIDB_HOST }}
          TIDB_PORT:      ${{ secrets.TIDB_PORT }}
          TIDB_USER:      ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD:  ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE:  ${{ secrets.TIDB_DATABASE }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          # AI要約・市況考察・開示分析に必須。未設定だとAI系が全てスキップされる
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # EDINET公式API（有報「事業の内容」の増分更新）。未設定だと該当ステップのみスキップ
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          # LINE通知（イブニング便で日次レポート完成をpush・スイング候補通知にも共用）。
          # 未設定・送信失敗は他処理を最後まで継続した後、ジョブを失敗にして再試行対象にする。
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # 日次レポート全文リンクの公開URL（本番: https://stock-tracker-rfqn.onrender.com）。
          # 未設定なら daily_report.DEFAULT_REPORT_BASE_URL が使われる
          REPORT_BASE_URL: ${{ secrets.REPORT_BASE_URL }}
          SCHEDULED_FOR: ${{ inputs.scheduled_for }}
          TARGET_DATE: ${{ inputs.target_date }}
          # TIDB_SSL_CA は未設定 → certifi を自動使用
        run: |
          if [ "${{ inputs.mode }}" = "notify_test" ]; then
            python daily_report.py --notify
          elif [ "${{ inputs.mode }}" = "catch_up" ]; then
            if [ -z "$TARGET_DATE" ]; then
              echo "catch_upにはtarget_dateが必要です" >&2
              exit 2
            fi
            python daily_run.py --catch-up "$TARGET_DATE"
          elif [ "${{ inputs.mode }}" = "youtube_daily" ]; then
            # YouTube日次巡回 → 日次レポートを再生成して要約を反映（本編バッチは遅らせない）
            python youtube_insights.py --daily
            python -c "import daily_report; daily_report.save_report()"
          elif [ "${{ inputs.mode }}" = "evening" ]; then
            # LINE失敗でも後続のYouTube救済・最終保存は実行し、最後に元の終了コードを返す。
            evening_status=0
            if [ -n "$SCHEDULED_FOR" ]; then
              python daily_run.py --evening --scheduled-for "$SCHEDULED_FOR" || evening_status=$?
            else
              python daily_run.py --evening || evening_status=$?
            fi
            # 19:00便のYouTube集約がGemini 503等で失敗していたら救済（解析済み動画から集約のみ再試行）
            python youtube_insights.py --aggregate-only
            if [ -n "$SCHEDULED_FOR" ]; then
              report_date="${SCHEDULED_FOR%%T*}"
              REPORT_DATE="$report_date" python -c 'import os; from datetime import date; import daily_report; daily_report.save_report(date.fromisoformat(os.environ["REPORT_DATE"]))'
            else
              python -c "import daily_report; daily_report.save_report()"
            fi
            exit "$evening_status"
          else
            if [ -n "$SCHEDULED_FOR" ]; then
              python daily_run.py --scheduled-for "$SCHEDULED_FOR"
            else
              python daily_run.py
            fi
          fi

      - name: 結果サマリー
        if: always()
        run: echo "日次市場データ更新 ${{ job.status }} / source=${{ inputs.source || github.event_name }} / scheduled_for=${{ inputs.scheduled_for }}"
